name: Routeflow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: fe-app-forkop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe-app-forkop/package-lock.json
      - run: npm ci
      - run: bash -n ../install.sh
      - run: npx eslint src/routeflow
      - run: npx vitest run
      - run: npm run build
